[workspace]

[package]
name = "spike-m0-04-contracts-knowledge"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "Apache-2.0"
publish = false
description = "Spike M0 n°4 — Contrats observables, claims fermées, capture dirty et connaissance multilangage"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
indexing_slicing = "warn"

[dependencies]
unleash-domain = { path = "../../crates/unleash-domain" }
unleash-protocol = { path = "../../crates/unleash-protocol" }
unleash-testkit = { path = "../../crates/unleash-testkit" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonschema = { version = "0.61.2", default-features = false }
referencing = { version = "0.61.2", default-features = false }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["serde"] }
uuid = { version = "1.10", features = ["serde"] }
thiserror = "2.0"
tempfile = "3.27.0"
