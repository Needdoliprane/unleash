[workspace]
resolver = "3"
members = [
    "crates/unleash-domain",
    "crates/unleash-protocol",
    "crates/unleash-platform",
    "crates/unleash-client",
    "crates/unleash-store",
    "crates/unleash-testkit",
    "crates/unleash-browser",
    "crates/unleash-process-host",
    "crates/unleash-daemon",
    "crates/unleash-cli",
]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "Apache-2.0"
publish = false
repository = "https://github.com/Needdoliprane/unleash"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
indexing_slicing = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.dependencies]
unleash-domain = { version = "0.1.0", path = "crates/unleash-domain" }
unleash-protocol = { version = "0.1.0", path = "crates/unleash-protocol" }
unleash-platform = { version = "0.1.0", path = "crates/unleash-platform" }
unleash-client = { version = "0.1.0", path = "crates/unleash-client" }
unleash-store = { version = "0.1.0", path = "crates/unleash-store" }
unleash-testkit = { version = "0.1.0", path = "crates/unleash-testkit" }
unleash-browser = { version = "0.1.0", path = "crates/unleash-browser" }
unleash-process-host = { version = "0.1.0", path = "crates/unleash-process-host" }
portable-pty = "0.9.0"
unleash-daemon = { version = "0.1.0", path = "crates/unleash-daemon" }
rusqlite = { version = "0.43.0", features = ["bundled", "backup"] }
fantoccini = { version = "0.22.2", default-features = false }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs", "signal"] }
rustix = { version = "1.1", features = ["fs", "process", "net"] }
libc = "0.2"
hyper = { version = "1.0", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "client", "client-legacy", "server", "server-auto"] }
http = "1.0"
http-body-util = "0.1"
bytes = "1"
url = { version = "2.5", features = ["serde"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs = "0.2.0"
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat", "no-serde-warnings", "uuid-impl", "chrono-impl"] }
jsonschema = { version = "0.61.2", default-features = false }
referencing = { version = "0.61.2", default-features = false }
thiserror = "2.0"
uuid = { version = "1.10", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["serde"] }
proptest = "1.5"
dotenvy = "0.15.7"
secrecy = "0.10.3"
zeroize = "1.9.1"
tempfile = "3.27.0"
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
