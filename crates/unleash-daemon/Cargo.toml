[package]
name = "unleash-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "OVPT Unleash — Daemon utilisateur unique (autorité locale, socket IPC v2, barrière de démarrage, récupération et cycle de vie M0)"

[[bin]]
