serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
clap.workspace = true
getrandom = "0.3.4"
zeroize.workspace = true

[dev-dependencies]
unleash-cli = { version = "0.1.0", path = "../unleash-cli" }
unleash-client.workspace = true
unleash-testkit.workspace = true
unleash-tui.workspace = true
