[package]
name = "unleash-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "OVPT Unleash — Interface en ligne de commande stricte passant exclusivement par unleash-client (zéro accès SQLite)"

[[bin]]
name = "unleash"
path = "src/main.rs"

