unleash-protocol.workspace = true
unleash-domain.workspace = true
unleash-platform.workspace = true
tokio.workspace = true
clap.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
unleash-testkit.workspace = true
