# Gates de qualité du dépôt Unleash (voir .claude/dev/definition-of-done.md).
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  design-package:
    name: Dossier de conception
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet jsonschema
      - run: python -m unittest discover -s tools/design-package
      - run: python tools/design-package/validate.py .

  gui-renderer:
    name: GUI Renderer (React/TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/gui-renderer/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/gui-renderer/pnpm-lock.yaml
      - run: pnpm --dir apps/gui-renderer install --frozen-lockfile
      - run: pnpm --dir apps/gui-renderer run typecheck
      - run: pnpm --dir apps/gui-renderer run lint
      - run: pnpm --dir apps/gui-renderer test
      - run: pnpm --dir apps/gui-renderer run build
      - name: Vérifier absence de dérive ts-rs
        run: git diff --exit-code apps/gui-renderer/src/generated apps/gui-renderer/src/generated-gui

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système Linux pour Tauri 2 / WebKitGTK
        if: ${{ runner.os == 'Linux' && hashFiles('crates/unleash-gui/Cargo.toml') != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libssl-dev
      - name: Build assets GUI embarqués si présents
        if: ${{ hashFiles('apps/gui-renderer/package.json') != '' }}
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/gui-renderer/package.json
      - if: ${{ hashFiles('apps/gui-renderer/package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/gui-renderer/pnpm-lock.yaml
      - if: ${{ hashFiles('apps/gui-renderer/package.json') != '' }}
        run: |
          pnpm --dir apps/gui-renderer install --frozen-lockfile
          pnpm --dir apps/gui-renderer run build
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Vérifier absence de dérive ts-rs après tests Rust
        if: ${{ hashFiles('apps/gui-renderer/src/generated/**', 'apps/gui-renderer/src/generated-gui/**') != '' }}
        run: git diff --exit-code apps/gui-renderer/src/generated apps/gui-renderer/src/generated-gui

  deny:
    name: Dépendances (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
