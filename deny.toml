# Politique de dépendances (cargo-deny, format v2). Décision R7 : licence du produit Apache-2.0 (Q-06).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 (unmaintained, proc-macro de compilation sans CVE) est tiré transitivement par glib-macros 0.18.5 / gtk3-macros 0.18.2 <- gtk 0.18.2 <- tao/wry/tauri 2.12.6 sans mise à niveau disponible amont." },
  { id = "RUSTSEC-2026-0543", reason = "chrono 0.4.45 (avis informatif unmaintained sans CVE ni correctif amont) est requis par ts-rs 12.0.1 (chrono-impl) et le formatage RFC 3339 d'unleash-protocol/unleash-store ; réévaluation prévue lors du support jiff/time par ts-rs." },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Licences permissives compatibles avec une distribution Apache-2.0.
# MPL-2.0 (copyleft par fichier) est admise pour des dépendances non modifiées ; toute autre licence exige une dérogation écrite.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "BSL-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
